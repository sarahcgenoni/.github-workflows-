name: Cold Blind Research Runner

on:
  schedule:
    - cron: '0 0 * * 1' # Triggers every Monday at 00:00 UTC
  workflow_dispatch: # Allows you to manually trigger it from the UI

jobs:
  run-blind-experiment:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        # Installs the official Anthropic SDK for Claude
        pip install anthropic

    - name: Run Claude Research Tests
      env:
        # Secure credentials passed safely from GitHub Settings -> Secrets
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
        EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
      run: |
        python run_experiments.py

    - name: Commit and Push Blind Results
      run: |
        git config --global user.name "Blind-Test-Bot"
        git config --global user.email "bot@github.com"
        git add results/
        git commit -m "Automated Results: Claude research leg completed" || echo "No changes to commit"
        git push
