name: Cold Blind Research Runner

# This controls when the workflow runs
on:
  schedule:
    # Triggers every Monday at 10:00 AWST (Once a week execution)
    - cron: '0 0 * * 1'
  
  # Allows you to manually trigger the leg of research anytime from the GitHub UI
  workflow_dispatch:
    inputs:
      research_leg:
        description: 'Identifier for this leg of testing (e.g., leg_2_params)'
        required: false
        default: 'manual_test'

jobs:
  run-blind-experiment:
    runs-on: ubuntu-latest

    steps:
    # 1. Cleans the environment and checks out your repository code
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    # 2. Sets up a completely fresh, isolated Python environment (Cold Start)
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 3. Installs any dependencies your research needs
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    # 4. Executes all of your automated tasks/tests sequentially
    - name: Run Cold Blind Tests
      env:
        # If your research requires hidden API keys, pass them safely here
        RESEARCH_SECRET_KEY: ${{ secrets.RESEARCH_SECRET_KEY }}
      run: |
        python run_experiments.py

    # 5. Saves the output results back to your GitHub repository automatically
    - name: Commit and Push Blind Results
      run: |
        git config --global user.name "Blind-Test-Bot"
        git config --global user.email "bot@github.com"
        git add results/
        git commit -m "Automated Results: Cold test execution completed" || echo "No changes to commit"
        git push

